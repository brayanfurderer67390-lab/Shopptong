<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOPPTON-G68</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:22px 18px;
  text-align:center;
}

header h1{margin:0;font-size:28px}
header p{margin:8px 0 0;color:#ccc}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.welcome{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 10px #0001;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.product{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 10px #0001;
}

.product img{
  width:100%;
  height:150px;
  object-fit:cover;
  background:#eee;
}

.product-info{padding:14px}
.product h3{margin:0 0 8px}

.price{
  font-size:20px;
  font-weight:bold;
}

.weight{
  color:#777;
  font-size:14px;
  margin:5px 0 12px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  font-weight:bold;
  cursor:pointer;
}

.add{
  width:100%;
  background:#111;
  color:white;
}

.cart-button{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#111;
  color:white;
  padding:15px 20px;
  border-radius:50px;
  box-shadow:0 4px 15px #0004;
  z-index:20;
}

.cart-count{
  background:white;
  color:#111;
  border-radius:50%;
  padding:3px 7px;
  margin-left:5px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:30;
  padding:20px;
}

.box{
  background:white;
  max-width:500px;
  margin:20px auto;
  border-radius:20px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding:12px 0;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
}

.quantity button{
  background:#eee;
  padding:7px 11px;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin:20px 0;
}

.primary{
  width:100%;
  background:#229ED9;
  color:white;
  font-size:16px;
}

.secondary{
  width:100%;
  margin-top:10px;
  background:#eee;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.form-group input,
.form-group textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.summary{
  background:#f5f5f5;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
}

.summary p{
  margin:8px 0;
}

.contact{
  display:block;
  text-align:center;
  background:#229ED9;
  color:white;
  text-decoration:none;
  padding:15px;
  border-radius:14px;
  margin-top:20px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:450px){
  .products{grid-template-columns:1fr 1fr}
  .product img{height:125px}
}
</style>
</head>

<body>

<header>
  <h1 id="shopName">SHOPPTON-G68</h1>
  <p id="subtitle">Votre boutique</p>
</header>

<div class="container">

  <div class="welcome">
    <h2>Bienvenue 👋</h2>
    <p id="welcomeText">Bienvenue sur SHOPPTON-G68</p>
    <p id="deliveryText">Livraison disponible</p>
  </div>

  <h2>🛍️ Nos produits</h2>

  <div id="products" class="products">
    <div class="empty">Chargement...</div>
  </div>

  <a id="contactBtn" class="contact" href="#" target="_blank">
    💬 Nous contacter sur Telegram
  </a>

</div>

<button class="cart-button" onclick="openCart()">
  🛒 Panier
  <span id="cartCount" class="cart-count">0</span>
</button>


<!-- PANIER -->

<div id="cartModal" class="modal">

  <div class="box">

    <h2>🛒 Mon panier</h2>

    <div id="cartItems"></div>

    <div id="cartTotal" class="total">
      Total : 0.00 €
    </div>

    <button class="primary" onclick="openCheckout()">
      📝 Passer la commande
    </button>

    <button class="secondary" onclick="closeCart()">
      Fermer
    </button>

  </div>

</div>


<!-- FORMULAIRE -->

<div id="checkoutModal" class="modal">

  <div class="box">

    <h2>📝 Informations de livraison</h2>

    <div class="form-group">
      <label>Nom / prénom</label>
      <input id="customerName" type="text" placeholder="Votre nom">
    </div>

    <div class="form-group">
      <label>Téléphone</label>
      <input id="customerPhone" type="tel" placeholder="06 00 00 00 00">
    </div>

    <div class="form-group">
      <label>Adresse de livraison</label>
      <textarea id="customerAddress"
        placeholder="Adresse complète"></textarea>
    </div>

    <div class="form-group">
      <label>Zone de livraison</label>
      <input id="customerZone"
        type="text"
        placeholder="Votre ville / secteur">
    </div>

    <div class="form-group">
      <label>Note (facultatif)</label>
      <textarea id="customerNote"
        placeholder="Information supplémentaire"></textarea>
    </div>

    <button class="primary" onclick="showSummary()">
      Continuer
    </button>

    <button class="secondary" onclick="closeCheckout()">
      Retour
    </button>

  </div>

</div>


<!-- RECAPITULATIF -->

<div id="summaryModal" class="modal">

  <div class="box">

    <h2>📋 Récapitulatif</h2>

    <div id="summaryContent" class="summary"></div>

    <button class="primary" onclick="sendOrder()">
      💬 Envoyer la commande sur Telegram
    </button>

    <button class="secondary" onclick="closeSummary()">
      Modifier
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
'https://eioqszrcedwiixicsnij.supabase.co';


/*
 IMPORTANT :
 GARDE ICI TA VRAIE CLÉ sb_publishable_...
 que tu utilises actuellement.
 Ne mets jamais la clé service_role.
*/

const SUPABASE_ANON_KEY = `
sb_publishable_UVYmcUeEQtuJwKs0awaFKQ_SJd_mqJX



`.replace(/\s/g,'');


const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


let products = [];
let cart = {};


async function loadShop(){

  const {data,error} = await sb
    .from('settings')
    .select('*')
    .limit(1)
    .maybeSingle();

 if(error){

  console.log(error);

  container.innerHTML =
    '<div class="empty">Erreur produits : ' +
    error.message +
    '</div>';

  return;
}
  }

  if(data){

    if(data.shop_name)
      document.getElementById('shopName').textContent =
        data.shop_name;

    if(data.subtitle)
      document.getElementById('subtitle').textContent =
        data.subtitle;

    if(data.welcome_text)
      document.getElementById('welcomeText').textContent =
        data.welcome_text;

    if(data.delivery_text)
      document.getElementById('deliveryText').textContent =
        data.delivery_text;

    if(data.contact){

      let contact = data.contact;

      if(contact.startsWith('@'))
        contact = contact.substring(1);

      document.getElementById('contactBtn').href =
        'https://t.me/' + contact;
    }
  }
}


async function loadProducts(){

  const {data,error} = await sb
    .from('products')
    .select('*')
    .eq('active',true)
    .order('created_at',{ascending:false});

  const container =
    document.getElementById('products');

  if(error){

    console.log(error);

    container.innerHTML =
      '<div class="empty">Impossible de charger les produits.</div>';

    return;
  }

  if(!data || data.length === 0){

    container.innerHTML =
      '<div class="empty">Aucun produit disponible.</div>';

    return;
  }

  products = data;

  container.innerHTML = '';

  data.forEach(product => {

    const card = document.createElement('div');

    card.className = 'product';

    let image = '';

    if(product.image_url){

      image =
        `<img src="${product.image_url}" alt="${product.name}">`;

    }else{

      image =
        `<div style="
        height:150px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:55px;
        background:#eee">
        ${product.emoji || '🛍️'}
        </div>`;
    }

    card.innerHTML = `

      ${image}

      <div class="product-info">

        <h3>
          ${product.emoji || ''} ${product.name}
        </h3>

        ${
          product.weight
          ? `<div class="weight">${product.weight}</div>`
          : ''
        }

        <div class="price">
          ${Number(product.price).toFixed(2)} €
        </div>

        <button class="add">
          Ajouter au panier
        </button>

      </div>
    `;

    card.querySelector('.add').onclick = () => {
      addToCart(product);
    };

    container.appendChild(card);

  });

}


function addToCart(product){

  if(!cart[product.id]){

    cart[product.id] = {
      product:product,
      quantity:1
    };

  }else{

    cart[product.id].quantity++;

  }

  updateCart();
}


function changeQuantity(id,change){

  if(!cart[id]) return;

  cart[id].quantity += change;

  if(cart[id].quantity <= 0)
    delete cart[id];

  updateCart();
}


function updateCart(){

  let count = 0;
  let total = 0;

  Object.values(cart).forEach(item => {

    count += item.quantity;

    total +=
      Number(item.product.price) *
      item.quantity;

  });

  document.getElementById('cartCount').textContent =
    count;

  const container =
    document.getElementById('cartItems');

  if(count === 0){

    container.innerHTML =
      '<div class="empty">Votre panier est vide.</div>';

  }else{

    container.innerHTML = '';

    Object.values(cart).forEach(item => {

      const product = item.product;

      const div =
        document.createElement('div');

      div.className = 'cart-item';

      div.innerHTML = `

        <div>
          <strong>${product.name}</strong>
          <br>
          ${Number(product.price).toFixed(2)} €
        </div>

        <div class="quantity">

          <button onclick="changeQuantity('${product.id}',-1)">
            −
          </button>

          <strong>${item.quantity}</strong>

          <button onclick="changeQuantity('${product.id}',1)">
            +
          </button>

        </div>

      `;

      container.appendChild(div);

    });

  }

  document.getElementById('cartTotal').textContent =
    'Total : ' + total.toFixed(2) + ' €';

}


function openCart(){

  document.getElementById('cartModal').style.display =
    'block';

  updateCart();
}


function closeCart(){

  document.getElementById('cartModal').style.display =
    'none';

}


function openCheckout(){

  if(Object.keys(cart).length === 0){

    alert('Votre panier est vide.');

    return;
  }

  closeCart();

  document.getElementById('checkoutModal').style.display =
    'block';
}


function closeCheckout(){

  document.getElementById('checkoutModal').style.display =
    'none';

}


function showSummary(){

  const name =
    document.getElementById('customerName').value.trim();

  const phone =
    document.getElementById('customerPhone').value.trim();

  const address =
    document.getElementById('customerAddress').value.trim();

  const zone =
    document.getElementById('customerZone').value.trim();

  const note =
    document.getElementById('customerNote').value.trim();


  if(!name || !phone || !address || !zone){

    alert(
      'Merci de remplir le nom, téléphone, adresse et zone de livraison.'
    );

    return;
  }


  let html = `
    <p><strong>👤 Nom :</strong> ${name}</p>
    <p><strong>📞 Téléphone :</strong> ${phone}</p>
    <p><strong>📍 Adresse :</strong> ${address}</p>
    <p><strong>🗺️ Zone :</strong> ${zone}</p>
  `;

  if(note){

    html +=
      `<p><strong>📝 Note :</strong> ${note}</p>`;

  }


  let total = 0;

  html += '<hr>';

  Object.values(cart).forEach(item => {

    const product = item.product;

    const lineTotal =
      Number(product.price) * item.quantity;

    total += lineTotal;

    html += `
      <p>
        ${product.name} × ${item.quantity}
        — ${lineTotal.toFixed(2)} €
      </p>
    `;

  });


  html += `
    <hr>
    <p><strong>💰 Total : ${total.toFixed(2)} €</strong></p>
  `;


  document.getElementById('summaryContent').innerHTML =
    html;

  closeCheckout();

  document.getElementById('summaryModal').style.display =
    'block';
}


function closeSummary(){

  document.getElementById('summaryModal').style.display =
    'none';

  document.getElementById('checkoutModal').style.display =
    'block';
}


function sendOrder(){

  const name =
    document.getElementById('customerName').value.trim();

  const phone =
    document.getElementById('customerPhone').value.trim();

  const address =
    document.getElementById('customerAddress').value.trim();

  const zone =
    document.getElementById('customerZone').value.trim();

  const note =
    document.getElementById('customerNote').value.trim();


  let message =
`Bonjour, je souhaite passer une commande.

👤 Nom : ${name}
📞 Téléphone : ${phone}
📍 Adresse : ${address}
🗺️ Zone : ${zone}`;

  if(note){

    message +=
`\n📝 Note : ${note}`;

  }


  message +=
`\n\n🛒 COMMANDE :`;


  let total = 0;

  Object.values(cart).forEach(item => {

    const product = item.product;

    const lineTotal =
      Number(product.price) * item.quantity;

    total += lineTotal;

    message +=
`\n• ${product.name} × ${item.quantity} = ${lineTotal.toFixed(2)} €`;

  });


  message +=
`\n\n💰 TOTAL : ${total.toFixed(2)} €`;


  let contact =
    document.getElementById('contactBtn').href;

  if(!contact || contact === '#'){

    alert('Contact Telegram non configuré.');

    return;

  }


  contact =
    contact.replace(/\/$/, '');

  const telegramUrl =
    contact + '?text=' + encodeURIComponent(message);


  window.location.href = telegramUrl;

}

  }

}


loadShop();
loadProducts();
updateCart();

</script>

</body>
</html>
